<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>Login - Student Grading System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 36px 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); width: 320px; }
    h2 { text-align: center; margin-bottom: 24px; color: #333; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #555; }
    input { width: 100%; padding: 9px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; }
    button:hover { background: #45a049; }
    #pesan { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username"/>
    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password"/>
    <button onclick="login()">Login</button>
    <div id="pesan"></div>
  </div>
  <script src="/static/script.js"></script>
  <script>
    // Jika sudah login, langsung ke dashboard
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "/dashboard";
    }

    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === "admin" && password === "123") {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "/dashboard";
      } else {
        document.getElementById("pesan").textContent = "Username atau password salah.";
      }
    }

    // Izinkan login dengan Enter
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
